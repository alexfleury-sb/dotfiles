# Debian config file. Run together with the shared base:
#   ./install.sh base.yaml remote_debian.yaml

- defaults:
    link:
        create: true
        relink: true
        force: true

- clean: ["~", "~/.config"]

# Saving important regular files (content may be moved to the "_local" file).
- shell:
    - "[ ! -f ~/.bashrc ] || test -h ~/.bashrc || mv ~/.bashrc ~/.bashrc_backup"

- link:
    ~/.bashrc: shell/bashrc
